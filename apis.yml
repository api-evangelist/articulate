aid: articulate
name: Articulate
description: >-
  Articulate is an AI-powered workplace-training platform for creating,
  collaborating on, and distributing e-learning at scale. Its Articulate 360
  suite pairs Rise (web-based responsive authoring) and Storyline (desktop
  authoring for custom interactive content) with Review 360 (stakeholder
  feedback), Reach 360 (an integrated LMS for sharing and tracking training),
  Content Library 360, an agentic AI Assistant, and localization into 80+
  languages. The platform serves 125,000+ organizations across 187 countries
  and 133 million learners. Articulate does not publish a public developer REST
  API; its programmatic surface is the id.articulate.com identity provider
  (OpenID Connect / OAuth 2.0, Okta-hosted) used for single sign-on, plus
  standards-based content interoperability (SCORM and xAPI) emitted by its
  authoring tools. Surfaced as a portfolio company of ICONIQ Capital.
